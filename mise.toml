# ================================================================
# Settings
# ================================================================
[settings]
auto_install = false
minimum_release_age = "3d"


# ================================================================
# Tools
# ================================================================
[tools]
node = "24"
gitleaks = "8"
lefthook = "2"
zizmor = "1"


# ================================================================
# Tasks
# See: https://mise.jdx.dev/tasks/toml-tasks.html
# ================================================================

[tasks.setup]
description = "Setup project"
run = [
  "mise trust -q",
  "mise install",
  "corepack enable pnpm",
  "mise run install",
  "lefthook install",
]
alias = "s"

[tasks.install]
description = "Install dependencies"
run = "pnpm install"
alias = "i"

[tasks.dev]
description = "Start development server"
run = "pnpm dev"
alias = "d"

[tasks.build]
description = "Build project"
run = "pnpm build"
alias = "b"

# Code
[tasks.code-fix]
description = "Fix code issues (format + lint:fix)"
run = ["pnpm format", "pnpm lint:fix"]
alias = "cf"

[tasks.code-check]
description = "Check code issues (typecheck + format:check + lint + test)"
run = ["pnpm typecheck", "pnpm format:check", "pnpm lint", "pnpm test"]
alias = "cc"

# Composite
[tasks.fix]
description = "Fix all issues"
depends = ["code-fix", "gh-fix"]
alias = "f"

[tasks.check]
description = "Check for all issues"
depends = ["code-check", "gh-check", "gitleaks-check"]
alias = "c"

[tasks.fix-and-check]
description = "Fix all issues and check for issues"
run = [{ task = "fix" }, { task = "check" }]
alias = "fc"

[tasks.clean]
description = "Clean project artifacts"
run = ["rm -rf node_modules", "rm -rf .output", "rm -rf .wxt"]

[tasks.clean-build]
description = "Clean and rebuild project"
run = [{ task = "clean" }, { task = "install" }, { task = "build" }]
alias = "cb"

[tasks.release]
description = "Run all tasks for release"
run = [
  { task = "clean" },
  { task = "install" },
  { task = "fix-and-check" },
  { task = "build" },
]
alias = "r"

# GitHub Actions
[tasks.gh-check]
description = "Check GitHub Actions workflows"
run = "zizmor . --persona=pedantic --min-severity=medium"
alias = "ghc"

[tasks.gh-fix]
description = "Fix GitHub Actions workflows"
run = "zizmor --fix=all ."
alias = "ghf"

# Secrets
[tasks.gitleaks-check]
description = "Check for leaked secrets"
run = "gitleaks git --redact --no-banner"
alias = "glc"

[tasks.gitleaks-protect]
description = "Check staged files for leaked secrets"
run = "gitleaks git --pre-commit --redact --no-banner"
alias = "glp"
